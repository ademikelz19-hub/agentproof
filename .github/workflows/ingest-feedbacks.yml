name: Autonomous Feedback & Reputation Ingestion

on:
  schedule:
    # Run every 6 hours at minute 15 (4 runs/day = ~40 min/month on GitHub Actions free tier)
    - cron: '15 */6 * * *'
  workflow_dispatch:

concurrency:
  group: feedback-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Ingest 8004scan Feedbacks & Compute Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ingest feedback and compute reputation snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EIGHT004SCAN_API_KEY: ${{ secrets.EIGHT004SCAN_API_KEY }}
          EIGHT_O_FOUR_API_KEY: ${{ secrets.EIGHT_O_FOUR_API_KEY }}
          MAX_FEEDBACK_PAGES: '25'
        run: npx tsx scripts/ingest-feedbacks.ts
